<style>

html,body{margin:0}

.btn.danger{background:rgba(239,68,68,.15);color:#fca5a5;border-color:rgba(239,68,68,.4)}

.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:10px}
.lbl{display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 0 6px}

.check{display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:600;cursor:pointer}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

.gen{display:grid;grid-template-columns:1fr 170px auto;gap:8px}
@media(max-width:640px){.gen{grid-template-columns:1fr}}
.hero{display:flex;gap:18px;align-items:center;border-color:rgba(245,158,11,.3)}

.ok-box{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);color:#bbf7d0;border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px}

.words{line-height:2.3;margin:8px 0}

.w-mid{background:rgba(245,158,11,.16);color:#fcd34d;border-color:rgba(245,158,11,.45)}

.w-om{color:#94a3b8;border:1px dashed #64748b;text-decoration:line-through}
.w-ins{color:#cbd5e1;font-style:italic;background:rgba(148,163,184,.1);border:1px dotted #64748b}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--muted);font-weight:600}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}

.tips li{margin-bottom:6px}

.rank{max-width:560px;margin:14px auto;display:flex;flex-direction:column;gap:8px;text-align:left}
.rk{position:relative;display:flex;align-items:center;gap:10px;background:#0f172a;border:1px solid #1e293b;border-radius:14px;padding:10px 12px;overflow:hidden}

.avgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}

.avbtn{font-size:26px;background:#0f172a;border:2px solid #1e293b;border-radius:12px;padding:6px 0;cursor:pointer}
.avbtn.sel{border-color:var(--gold);background:rgba(245,158,11,.15)}
.recorder{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0}
.rec-btn{width:156px;height:156px;border-radius:50%;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:Fredoka,sans-serif;font-size:20px;font-weight:700;color:#111;background:radial-gradient(circle at 35% 30%,#fde68a,#f59e0b 55%,#b45309);box-shadow:0 0 0 8px rgba(245,158,11,.15),0 18px 40px rgba(0,0,0,.4)}
.rec-btn .rec-ico{font-size:44px}
.rec-btn.on{color:#fff;background:radial-gradient(circle at 35% 30%,#fca5a5,#ef4444 55%,#991b1b);animation:pulse 1.2s infinite}
.hint{text-align:center;color:var(--muted);font-weight:600;font-size:14px;margin:0}
.meter{width:220px;height:10px;border-radius:999px;background:#1e293b;overflow:hidden}

audio{width:100%;max-width:420px}

.adjust{background:#0b1222;border:1px solid #1e293b;border-radius:14px;padding:4px 14px 12px;margin:14px 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);opacity:0;pointer-events:none;z-index:80;max-width:min(92vw,560px);padding:12px 16px;border-radius:14px;font-weight:700;font-size:14px;background:#1e293b;border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.5);transition:.25s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.foot{text-align:center;color:#475569;font-size:11.5px;margin-top:10px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

</style>

<div class="top">
  <div class="panel topbar">
    <div class="brand">
      <div class="logo">🦜</div>
      <div><div class="title">Franpañol Duel</div><div class="subt">🇫🇷 Le Juego des Voix 🇪🇸 · Mascote Piquito</div></div>
    </div>
    <div id="hdr" class="row wrap-row"></div>
  </div>
</div>
<main id="app" class="wrap"></main>
<div id="modal-root"></div>

<script>
'use strict';
/* =====================================================================
   Franpañol Duel — duelo de pronúncia com avaliação real (Azure AI Speech)
   - Professor: abre esta página no computador (modo professor).
   - Alunos: entram pelo QR code (?sala=PIN) e gravam no celular.
   - O áudio vai do celular direto para o computador do professor (WebRTC/PeerJS),
     que envia para o Azure. A chave do Azure nunca sai do computador do professor.
   ===================================================================== */

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const scoreCls = v => v == null ? '' : v >= 80 ? 's-ok' : v >= 60 ? 's-mid' : 's-bad';

const PEER_PREFIX = 'franpanol-duel-v2-';
const PEER_OPTS = Object.assign({ debug: 0 }, window.PEER_OPTS || {});

/* Servidores de retransmissão (TURN): quando a rede bloqueia a conexão direta entre
   aparelhos, o áudio passa por um servidor intermediário nas portas 80/443.
   - Se o professor colou os dados da conta Metered, eles são usados (e vão no QR code).
   - Sem isso, tentamos o relay público do Open Relay Project e o da PeerJS. */
function parseRelayInput(txt) {
  const t = String(txt || '').trim(); if (!t) return null;
  const m = t.match(/https?:\/\/([a-z0-9-]+)\.metered\.live\/api\/v1\/turn\/credentials\?apiKey=([\w-]+)/i);
  if (m) return { t: 'api', app: m[1].toLowerCase(), key: m[2] };
  const u = t.match(/username["']?\s*[:=]\s*["']([^"']+)["']/i), c = t.match(/credentials?["']?\s*[:=]\s*["']([^"']+)["']/i);
  const urls = [...new Set(t.match(/turns?:[^"'\s,\]]+/g) || [])].slice(0, 4);
  if (u && c && urls.length) return { t: 'static', urls, username: u[1], credential: c[1] };
  return null;
}
function validRelay(r) {
  if (!r || typeof r !== 'object') return null;
  if (r.t === 'api' && /^[a-z0-9-]{1,60}$/.test(r.app) && /^[\w-]{8,120}$/.test(r.key)) return { t: 'api', app: r.app, key: r.key };
  if (r.t === 'static' && Array.isArray(r.urls) && r.urls.length && r.urls.every(x => /^turns?:[\w.\-:?=&]+$/.test(x)) && typeof r.username === 'string' && typeof r.credential === 'string' && r.username.length < 200 && r.credential.length < 200)
    return { t: 'static', urls: r.urls.slice(0, 4), username: r.username, credential: r.credential };
  return null;
}
/* Link curto para o QR code: "a~app~key" (API) ou "m~host~usuário~senha" (servidores da Metered). */
const METERED_URLS = h => [`turn:${h}:80`, `turn:${h}:80?transport=tcp`, `turn:${h}:443`, `turns:${h}:443?transport=tcp`];
function encodeRelay(r) {
  const ok = x => !/[~&#\s]/.test(x);
  if (r.t === 'api' && ok(r.key)) return 'a~' + r.app + '~' + r.key;
  if (r.t === 'static' && ok(r.username) && ok(r.credential)) {
    const hosts = [...new Set(r.urls.map(u => u.replace(/^turns?:/, '').split(':')[0]))];
    if (hosts.length === 1 && /\.metered\.ca$/.test(hosts[0])) return 'm~' + hosts[0] + '~' + encodeURIComponent(r.username) + '~' + encodeURIComponent(r.credential);
  }
  return encodeRelayLong(r);
}
function decodeRelay(str) {
  const p = String(str || '').split('~');
  try {
    if (p[0] === 'a' && p.length === 3) return validRelay({ t: 'api', app: p[1], key: p[2] });

/* ---------- toast, modal, sons ---------- */
let toastTimer = null;
function toast(msg, type = 'info', ms = 3800) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show ' + type;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = type; }, ms);
}
let modalCleanup = null;
function openModal(html, onClose) {
  closeModal();
  $('#modal-root').innerHTML = `<div class="modal-bg"><div class="modal panel">${html}</div></div>`;
  modalCleanup = onClose || null;
  const bg = $('#modal-root .modal-bg');
  bg.addEventListener('mousedown', e => { if (e.target === bg) closeModal(); });
  return $('#modal-root .modal');
}
function closeModal() {
  if (modalCleanup) { const f = modalCleanup; modalCleanup = null; try { f(); } catch (e) {} }
  $('#modal-root').innerHTML = '';
}
let muted = store.get('fpd_muted', false);
function beep(type) {
  if (muted) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext; const ctx = new AC();
    const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination);
    const n = ctx.currentTime;
    if (type === 'win') { o.frequency.setValueAtTime(523, n); o.frequency.exponentialRampToValueAtTime(1046, n + .3); }
    else { o.frequency.setValueAtTime(330, n); o.frequency.exponentialRampToValueAtTime(495, n + .18); }
    g.gain.setValueAtTime(.15, n); g.gain.exponentialRampToValueAtTime(.001, n + .4);
    o.start(n); o.stop(n + .42); setTimeout(() => ctx.close(), 700);

/* ---------- voz de referência (síntese do navegador) ---------- */
function speak(text, locale) {
  if (!('speechSynthesis' in window)) return toast('Este navegador não tem voz sintetizada.', 'err');
  const ss = window.speechSynthesis; ss.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = locale; u.rate = .85;
  const vs = ss.getVoices(); const base = locale.slice(0, 2);
  const v = vs.find(x => x.lang.replace('_', '-') === locale) || vs.find(x => x.lang.toLowerCase().startsWith(base));
  if (v) u.voice = v;
  ss.speak(u);
}
if ('speechSynthesis' in window) window.speechSynthesis.getVoices();

/* ---------- carregar scripts sob demanda ---------- */
const scriptCache = {};
function loadScript(src) {
  if (!scriptCache[src]) scriptCache[src] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = res;
    s.onerror = () => { delete scriptCache[src]; rej(new Error('Falha ao carregar ' + src)); };
    document.head.appendChild(s);
  });
  return scriptCache[src];
}

  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data');
  v.setUint32(40, pcm.length * 2, true); new Int16Array(buf, 44).set(pcm);
  return buf;
}

function micError(err) {
  if (!window.isSecureContext || err.name === 'InsecureContext') return 'O microfone só funciona quando a página é aberta por um endereço https://.';
  if (err.name === 'NotAllowedError' || err.name === 'SecurityError') return 'O microfone foi bloqueado. Libere o acesso ao microfone nas permissões do navegador e tente de novo.';
  if (err.name === 'NotFoundError') return 'Nenhum microfone encontrado neste aparelho.';
  if (err.name === 'NoAudioEngine') return 'Este navegador não conseguiu gravar áudio. Tente pelo Chrome ou Edge atualizados.';
  if (err.name === 'NotReadableError') return 'O microfone está sendo usado por outro aplicativo. Feche-o e tente de novo.';
  return 'Não consegui acessar o microfone (' + (err.name || err.message) + ').';
}

/* Componente de gravação (usado no celular do aluno e no computador do professor) */
function mountRecorder(parent, opts) {
  const el = document.createElement('div'); el.className = 'recorder'; parent.appendChild(el);
  let rec = new Recorder();
  let state = 'idle', result = null, url = null, tick = null, busy = false;
  const api = {
    el,
    destroy() { clearInterval(tick); if (state === 'rec') rec.cancel(); if (url && !api.keepUrl) URL.revokeObjectURL(url); el.remove(); state = 'dead'; }
  };
  function draw() {
    if (state === 'idle') el.innerHTML = `<button class="rec-btn" data-r="start"><span class="rec-ico">🎙️</span><span>Gravar</span></button><p class="hint">Toque, fale a frase e toque de novo para parar.<br><small>Máximo de ${opts.maxSec} segundos.</small></p>`;
    else if (state === 'rec') el.innerHTML = `<button class="rec-btn on" data-r="stop"><span class="rec-ico">⏹️</span><span>Parar</span></button><div class="meter"><i class="lvl"></i></div><p class="hint"><b class="rtime">0.0</b> s</p>`;
    else if (state === 'review') el.innerHTML = `<p class="hint">Ouça antes de enviar:</p><audio controls src="${url}"></audio><div class="row center wrap-row"><button class="btn" data-r="redo">🔁 Regravar</button><button class="btn gold big" data-r="send">📤 Enviar</button></div>`;
    else if (state === 'wait') el.innerHTML = `<p class="hint"><i class="spin"></i> Um instante…</p>`;
    else if (state === 'perm') el.innerHTML = `<p class="hint"><i class="spin"></i> Aguardando o microfone…</p>
      <div class="warn small" style="max-width:420px;margin:0">🎤 O navegador deve estar pedindo permissão para usar o microfone — procure a janelinha perto da barra de endereço (ou o ícone 🎤/🔒 nela) e clique em <b>Permitir</b>.</div>
      <button class="btn sm" data-r="cancel">Cancelar</button>`;
  }
  async function stop() {
    if (state !== 'rec') return;
    clearInterval(tick); busy = true; state = 'wait'; draw();
    try { result = await rec.stop(); } catch (e) { result = { empty: true }; }
    busy = false;
    if (result.empty || (result.speechDur || 0) < 0.25) { state = 'idle'; draw(); toast('Não ouvi sua voz. Fale mais perto do microfone e tente de novo.', 'err', 5000); return; }
    url = URL.createObjectURL(new Blob([result.wav], { type: 'audio/wav' }));
    state = 'review'; draw();
  }
  el.addEventListener('click', async e => {
    const b = e.target.closest('[data-r]'); if (!b) return;
    const a = b.dataset.r;
    if (a === 'cancel') { rec.cancel(); busy = false; state = 'idle'; draw(); return; }
    if (busy) return;
    if (a === 'start') {
      rec = new Recorder(); busy = true; state = 'wait'; draw();
      try {
        await rec.start(v => { const l = el.querySelector('.lvl'); if (l) l.style.width = (v * 100) + '%'; }, () => { if (state === 'wait') { state = 'perm'; draw(); } });
        if (state !== 'wait' && state !== 'perm') { rec.cancel(); busy = false; return; } // cancelado enquanto esperava
        state = 'rec'; draw();
        const t0 = Date.now();
        tick = setInterval(() => { const s = (Date.now() - t0) / 1000; const t = el.querySelector('.rtime'); if (t) t.textContent = s.toFixed(1); if (s >= opts.maxSec) stop(); }, 100);
      } catch (err) { if (err.name !== 'Cancelled') { state = 'idle'; draw(); toast(micError(err), 'err', 7000); } }
      busy = false;
    } else if (a === 'stop') stop();
    else if (a === 'redo') { if (url) URL.revokeObjectURL(url); url = null; result = null; state = 'idle'; draw(); }
    else if (a === 'send') {
      busy = true;
      const ok = await opts.onSubmit(result, url);
      busy = false;
      if (ok !== false) { api.keepUrl = true; state = 'sent'; }
    }
  });
  draw();
  return api;
}

/* =====================================================================
   RESULTADOS: cores por palavra, notas parciais e dicas
   ===================================================================== */
const TIP_RULES = {
  fr: [
    [/(an|am|en|em)([^aeiouyéèêàâîôûnm]|$)/, "som nasal 'an/en': um 'ã' bem aberto, sem fechar a boca no 'n'."],
    [/(on|om)([^aeiouyéèêàâîôûnm]|$)/, "som nasal 'on': lábios arredondados, um 'õ' sem pronunciar o 'n'."],
    [/(in|im|ain|ein|un|um)([^aeiouyéèêàâîôûnm]|$)/, "som nasal 'in/ain/un': parecido com 'ẽ' aberto — não diga 'in' como em português."],
    [/(^|[^oaeqg])[uû]/, "'u' francês: faça bico como para dizer 'u', mas diga 'i'."],
    [/o[uùû]/, "'ou' se pronuncia como o 'u' do português (vous = 'vu')."],
    [/eu|œu|œ/, "'eu': diga 'ê' com os lábios arredondados."],
    [/oi/, "'oi' soa como 'uá' (moi = 'muá')."],
    [/r/, "o 'r' francês vem da garganta, suave — parecido com o 'r' carioca de 'carro'."],
    [/.{2,}[tdsxzp]$/, 'a consoante final geralmente é muda (petit = "peti").'],
    [/[éèê]/, "'é' é fechado (como 'ê'); 'è' e 'ê' são abertos (como 'é')."],
    [/ch/, "'ch' soa como o 'x' de 'xícara'."],
    [/gn/, "'gn' soa como 'nh'."],
    [/^h/, "o 'h' é mudo."]
  ],
  es: [
    [/rr|^r|[nls]r/, "'rr' e 'r' no começo da palavra: vibração forte da ponta da língua — não é o 'r' de garganta."],
    [/[aeiouáéíóú]r[aeiouáéíóú]/, "'r' entre vogais: um toque rápido da ponta da língua, como em 'caro'."],
    [/r($|[^aeiouáéíóúr])/, "'r' no fim da sílaba (hablar, tarde): toque da ponta da língua, nunca aspirado."],
    [/j|g[eéií]/, "'j' e 'ge/gi': som forte de garganta, como um 'rr' carioca raspado."],
    [/[bv]/, "'b' e 'v' têm o mesmo som: lábios juntos, sem encostar os dentes no lábio."],
    [/ll|y[aeiouáéíóú]/, "'ll' e 'y' antes de vogal soam como um 'i' forte."],
    [/ñ/, "'ñ' soa como 'nh'."],
    [/z|c[eéií]/, "'z' e 'ce/ci': na Espanha, língua entre os dentes (como o 'th' do inglês); na América Latina, som de 's'."],
    [/[td][ií]/, "'ti' e 'di' não viram 'tchi/dji' como no português do Brasil."],
    [/l$/, "o 'l' final é 'l' de verdade, não vira 'u' (sol, não 'sou')."],
    [/[oe]$/, "final '-o' é 'o' mesmo (não 'u') e final '-e' é 'e' (não 'i')."],
    [/[aeiouáéíóú][mn]/, "não nasalize a vogal antes de 'm/n' (con, não 'cõ')."],
    [/^h/, "o 'h' é mudo."]
  ]
};
function tipsFor(ev, lang) {
  const out = [], seen = new Set();
  const rules = TIP_RULES[lang] || [];
  const low = ev.words.filter(w => w.e === 'Mispronunciation' || (w.e === 'None' && w.s < 70)).sort((a, b) => a.s - b.s);
  for (const w of low) {
    const word = String(w.w || '').toLowerCase();
    for (const [re, tip] of rules) {
      if (out.length >= 3) break;
      if (re.test(word) && !seen.has(tip)) { seen.add(tip); out.push(`<b>${esc(w.w)}</b>: ${esc(tip)}`); break; }
    }
    if (out.length >= 3) break;
  }
  const om = ev.words.filter(w => w.e === 'Omission').map(w => w.w);
  const ins = ev.words.filter(w => w.e === 'Insertion').map(w => w.w);
  if (om.length) out.push(`Palavras que não apareceram na gravação: <b>${esc(om.join(', '))}</b>.`);
  if (ins.length) out.push(`Palavras a mais: <b>${esc(ins.join(', '))}</b>.`);
  if (ev.flu < 60 && ev.words.length) out.push('Fluência: tente falar a frase de uma vez, sem pausas longas entre as palavras.');
  return out;
}
function wordsHTML(words) {
  return words.map(w => {
    const e = w.e, s = Math.round(w.s);
    const cls = e === 'Omission' ? 'w-om' : e === 'Insertion' ? 'w-ins' : s >= 80 ? 'w-ok' : s >= 60 ? 'w-mid' : 'w-bad';
    const title = e === 'Omission' ? 'não foi dita' : e === 'Insertion' ? 'palavra a mais' : `precisão ${s}/100` + (e === 'Mispronunciation' ? ' · pronúncia com erro' : '');
    return `<span class="w ${cls}" title="${esc(title)}">${esc(w.w)}${e === 'Omission' || e === 'Insertion' ? '' : `<small>${s}</small>`}</span>`;
  }).join(' ');
}
function subHTML(label, v) { v = Math.round(v || 0); return `<div class="subc ${scoreCls(v)}"><span>${label}</span><b>${v}</b><i style="--v:${v}%"></i></div>`; }
function evalHTML(ev, lang) {
  if (ev.nomatch) return `<div class="warn">🤔 O Azure não reconheceu fala nessa gravação (muito baixa, com muito ruído ou com outra frase).</div>`;
  const tips = tipsFor(ev, lang);
  return `<div class="subs">${subHTML('Pronúncia geral', ev.pron)}${subHTML('Precisão', ev.acc)}${subHTML('Fluência', ev.flu)}${subHTML('Completude', ev.comp)}</div>
    <div class="words">${wordsHTML(ev.words)}</div>
    <div class="legend"><span style="--c:#22c55e">boa (80+)</span><span style="--c:#f59e0b">atenção (60–79)</span><span style="--c:#ef4444">errada (&lt;60)</span><span style="--c:#64748b">não dita / a mais</span></div>
    ${tips.length ? `<ul class="tips">${tips.map(t => `<li>${t}</li>`).join('')}</ul><p class="small muted">As dicas são sugestões automáticas a partir da escrita das palavras com nota mais baixa.</p>` : ''}
    ${ev.text ? `<p class="small muted">O Azure entendeu: “${esc(ev.text)}”</p>` : ''}`;
}

/* ----- gerador de frases por tema (banco embutido, sem IA) ----- */
const norm = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function matchThemes(q) {
  const n = norm(q); if (!n.trim()) return [];
  const toks = n.split(/[^a-z0-9]+/).filter(Boolean);
  const hit = k => k.includes(' ') ? n.includes(k) : toks.some(w => w.startsWith(k)); // início de palavra: "escola" não casa com "ola"
  return THEMES.map(t => ({ t, sc: t.kw.filter(hit).length + (n.includes(norm(t.name)) ? 3 : 0) }))
    .filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc).map(x => x.t);
}
function needPerLang() {
  const n = clamp(+H.setup.rounds || 5, 1, 30), m = H.setup.langMode;
  if (m === 'fr') return { fr: n, es: 0 };
  if (m === 'es') return { fr: 0, es: n };
  return { fr: Math.ceil(n / 2), es: Math.ceil(n / 2) };
}
function genFromThemes(themes, level) {
  const lv = LEVELS.map(x => x[0]), i = lv.indexOf(level);
  const order = [level]; for (let d = 1; d < lv.length; d++) { if (lv[i - d]) order.push(lv[i - d]); if (lv[i + d]) order.push(lv[i + d]); }
  const need = needPerLang(), out = { fr: [], es: [] }; let borrowed = false;
  for (const lang of ['fr', 'es']) {
    for (const l of order) {
      if (l !== level && out[lang].length >= Math.max(need[lang], 1)) break;
      const add = shuffle(themes.flatMap(t => t[lang][l] || []));
      if (l !== level && add.length) borrowed = true;
      out[lang].push(...add);
    }
  }
  return { fr: out.fr, es: out.es, borrowed };
}
function fillPhrases(fr, es) {
  const tf = $('#t-fr'), te = $('#t-es');
  if ((tf.value.trim() || te.value.trim()) && !confirm('Substituir as frases atuais pelas novas?')) return false;
  tf.value = fr.join('\n'); te.value = es.join('\n'); readSetup(); return true;
}

  if (!q.trim()) { msg.innerHTML = `<p class="small" style="color:#fde68a">Digite um tema ou escolha um dos temas prontos abaixo.</p>`; return; }
  const themes = forced || matchThemes(q);
  if (!themes.length) {
    msg.innerHTML = `<div class="warn small" style="margin:10px 0 0">Não tenho frases prontas sobre “${esc(q)}”. Escolha um dos temas prontos abaixo ou use <a href="#" data-act="ai-prompt">🤖 Gerar com IA</a> para qualquer tema.</div>`;
    return;
  }
  const g = genFromThemes(themes, level);
  if (!fillPhrases(g.fr, g.es)) return;
  const lvName = LEVELS.find(x => x[0] === level)[1];
  msg.innerHTML = `<p class="small" style="color:#bbf7d0">✅ Frases de <b>${esc(themes.map(t => t.name).join(' + '))}</b> (${lvName}) colocadas abaixo.${g.borrowed ? ' Para completar as rodadas, entraram algumas de níveis vizinhos.' : ''} Pode editar à vontade.</p>`;
};

/* ----- tema livre: o site monta o pedido para uma IA de chat ----- */
const LEVEL_DESC = {
  facil: 'Fácil: frases curtas (3 a 6 palavras), vocabulário do dia a dia.',
  medio: 'Médio: frases de 6 a 10 palavras, vocabulário comum.',
  dificil: "Difícil: 8 a 14 palavras, com sons difíceis para brasileiros (francês: vogais nasais, 'u', 'r' e consoantes finais mudas; espanhol: 'rr', 'j', 'll', 'z' e 'b/v').",
  insano: 'Insano: 12 a 20 palavras, bem desafiadoras, no estilo trava-língua, cheias de sons difíceis para brasileiros.'
};
function aiPromptText(theme, level) {
  const need = needPerLang(), n = x => Math.max(x + 2, 5);
  const langs = [need.fr ? `${n(need.fr)} frases em francês` : '', need.es ? `${n(need.es)} frases em espanhol` : ''].filter(Boolean).join(' e ');
  return `Crie frases para um jogo de pronúncia em sala de aula com alunos brasileiros.
Tema: ${theme || '(escreva o tema aqui)'}
Nível: ${LEVEL_DESC[level]}
Quero ${langs}, corretas e naturais, cada uma com a tradução para o português do Brasil.
Responda SOMENTE com as linhas abaixo, uma frase por linha, sem numeração, sem títulos e sem comentários:
${need.fr ? 'FR: frase em francês | tradução em português\n' : ''}${need.es ? 'ES: frase em espanhol | tradução em português' : ''}`.trim();
}
ACT['ai-prompt'] = () => {
  readSetup();
  const theme = ($('#g-theme') && $('#g-theme').value.trim()) || '', level = ($('#g-level') && $('#g-level').value) || 'medio';
  const m = openModal(`
    <div class="row between"><h3>🤖 Gerar frases com IA</h3><button class="btn sm ghost" data-act="close-modal">✕</button></div>
    <p class="small muted" style="margin-top:0"><b>1.</b> Copie o pedido abaixo (ajuste o tema se quiser). <b>2.</b> Cole numa IA de chat, como o <a href="https://claude.ai" target="_blank" rel="noopener">Claude</a> ou o <a href="https://chatgpt.com" target="_blank" rel="noopener">ChatGPT</a>. <b>3.</b> Copie a resposta e cole no segundo campo.</p>
    <label class="lbl" for="ai-q">Pedido para a IA</label>
    <textarea id="ai-q" style="min-height:190px">${esc(aiPromptText(theme, level))}</textarea>
    <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn sm" data-act="ai-copy">📋 Copiar pedido</button></div>
    <label class="lbl" for="ai-a">Resposta da IA</label>
    <textarea id="ai-a" style="min-height:150px" placeholder="FR: … | …&#10;ES: … | …"></textarea>
    <div id="ai-msg"></div>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn gold" data-act="ai-use">✅ Usar estas frases</button></div>`);
  if (!theme) m.querySelector('#ai-q').focus();
};
ACT['ai-copy'] = () => {
  const t = $('#ai-q'); t.select();
  (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => toast('Pedido copiado!', 'ok'), () => { try { document.execCommand('copy'); toast('Pedido copiado!', 'ok'); } catch (e) { toast('Selecione o texto e copie com Ctrl+C.'); } });
};
ACT['ai-use'] = () => {
  const fr = [], es = [];
  $('#ai-a').value.split(/\r?\n/).forEach(line => {
    const m = line.replace(/\*\*/g, '').match(/^\s*(?:[-*•]|\d+[.)])?\s*(FR|ES|FRANC[EÊ]S|ESPANHOL|FRENCH|SPANISH)\s*[:\-–—]\s*(.+)$/i);
    if (!m) return;
    const tag = norm(m[1]); (tag.startsWith('fr') ? fr : es).push(m[2].trim());
  });
  if (!fr.length && !es.length) { $('#ai-msg').innerHTML = `<div class="err-box" style="margin-top:10px">Não encontrei linhas no formato “FR: frase | tradução” ou “ES: frase | tradução”. Confira a resposta colada.</div>`; return; }
  closeModal();
  if (fillPhrases(fr, es)) toast(`${fr.length + es.length} frases da IA colocadas na lista. Revise antes de começar.`, 'ok', 5000);
};

function parseLines(txt, lang) {
  return String(txt || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const i = l.indexOf('|');
    const text = (i >= 0 ? l.slice(0, i) : l).trim().replace(/^["“”«»]+|["“”«»]+$/g, '').trim();
    const tr = i >= 0 ? l.slice(i + 1).trim() : '';
    return { lang, text: text.slice(0, 220), tr: tr.slice(0, 220) };
  }).filter(x => x.text);
}
function buildRounds() {
  const fr = shuffle(parseLines(H.setup.fr, 'fr')), es = shuffle(parseLines(H.setup.es, 'es'));
  let pool = [];
  const m = H.setup.langMode;
  if (m === 'fr') pool = fr;
  else if (m === 'es') pool = es;
  else if (m === 'mix') pool = shuffle(fr.concat(es));
  else {
    const [a, b] = Math.random() < .5 ? [fr, es] : [es, fr];
    for (let i = 0; i < Math.max(a.length, b.length); i++) { if (a[i]) pool.push(a[i]); if (b[i]) pool.push(b[i]); }
  }
  const n = clamp(+H.setup.rounds || 5, 1, 30);
  let lastC = -1;
  return { rounds: pool.slice(0, n).map(x => {
    let character = null;
    if (H.setup.characters) { let k; do { k = Math.floor(Math.random() * CHARACTERS.length); } while (k === lastC); lastC = k; character = CHARACTERS[k]; }
    return Object.assign({}, x, { character });
  }), available: pool.length, wanted: n };
}
ACT['open-room'] = () => {
  readSetup();
  const b = buildRounds();
  if (!b.rounds.length) return toast('Escreva pelo menos uma frase no(s) idioma(s) escolhido(s).', 'err');
  if (b.available < b.wanted) toast(`Só há ${b.available} frase(s) disponíveis — o jogo terá ${b.available} rodada(s).`);
  H.rounds = b.rounds;
  hostLobby(); ensurePeer();
};

/* ----- conexão (PeerJS): o computador do professor vira a "sala" ----- */
function roomURL() { return location.origin + location.pathname + '?sala=' + H.pin + (H.relay ? '&r=' + encodeRelay(H.relay) : ''); }
function newPin() { return String(Math.floor(1000 + Math.random() * 9000)); }
async function ensurePeer() {
  if ((H.peer && !H.peer.destroyed) || H.peerStarting) return;
  if (typeof Peer !== 'function') { H.peerState = 'error'; renderRoomInfo(); return; }
  if (!H.pin) H.pin = newPin();
  H.peerState = 'connecting'; renderRoomInfo();
  H.peerStarting = true;
  let opts; try { opts = await peerOptions(H.relay); } finally { H.peerStarting = false; }
  const peer = new Peer(PEER_PREFIX + H.pin, opts);
  H.peer = peer;
  peer.on('open', () => { H.peerState = 'open'; renderRoomInfo(); });
  peer.on('connection', conn => {
    conn.on('data', d => onStudentMsg(conn, d));
    conn.on('close', () => markOffline(conn));
    conn.on('error', () => markOffline(conn));
  });
  // Se cair só a ligação com o servidor de salas, as conexões com os alunos continuam;
  // tentamos reconectar sem destruir nada.
  peer.on('disconnected', () => { if (!peer.destroyed) { H.peerState = 'connecting'; renderRoomInfo(); hostRetry(peer, 1500); } });
  peer.on('error', err => {
    if (err.type === 'peer-unavailable') return;
    if (err.type === 'unavailable-id') {
      try { peer.destroy(); } catch (e) {}
      const hasRemote = [...H.players.values()].some(p => !p.local);
      if (!hasRemote) H.pin = newPin(); // PIN já usado por outra sala: sorteia outro
      clearTimeout(H.peerRetry); H.peerRetry = setTimeout(ensurePeer, hasRemote ? 5000 : 200);
      return;
    }
    H.peerState = 'error'; renderRoomInfo(); hostRetry(peer, 5000);
  });
}
function hostRetry(peer, ms) {
  clearTimeout(H.peerRetry);
  H.peerRetry = setTimeout(() => {
    if (H.peer !== peer) return;
    if (peer.destroyed) ensurePeer();
    else if (peer.disconnected) { try { peer.reconnect(); } catch (e) {} hostRetry(peer, 8000); }
    else { H.peerState = 'open'; renderRoomInfo(); }
  }, ms);
}
function sendTo(p, msg) { if (p && p.conn && p.conn.open) { try { p.conn.send(msg); } catch (e) {} } }
function playerByConn(conn) { return conn.playerId ? H.players.get(conn.playerId) : null; }
function markOffline(conn) { const p = playerByConn(conn); if (p && p.conn === conn) { p.online = false; refreshPlayers(); } }

function cleanName(n) { return String(n || '').replace(/[\u0000-\u001f<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 20); }
function uniqueName(name, exceptId) {
  const taken = new Set([...H.players.values()].filter(p => p.id !== exceptId).map(p => p.name.toLowerCase()));
  if (!taken.has(name.toLowerCase())) return name;
  for (let i = 2; ; i++) { const c = (name.slice(0, 17) + ' ' + i); if (!taken.has(c.toLowerCase())) return c; }
}
function addPlayer({ cid, name, avatar, local }) {
  const id = 'p' + (++H.seq);
  const p = { id, cid, name: uniqueName(cleanName(name) || 'Aluno', id), avatar: AVATARS.includes(avatar) ? avatar : AVATARS[H.seq % AVATARS.length], local: !!local, conn: null, online: !!local, res: {} };
  H.players.set(id, p);
  return p;
}

function onStudentMsg(conn, d) {
  if (!d || typeof d !== 'object') return;
  if (d.t === 'join') {
    const cid = String(d.cid || '').slice(0, 48);
    let p = [...H.players.values()].find(x => !x.local && x.cid === cid);
    if (p) { // reconexão
      if (p.conn && p.conn !== conn) { try { p.conn.close(); } catch (e) {} }
      p.conn = conn; p.online = true;
      if (AVATARS.includes(d.avatar)) p.avatar = d.avatar;
    } else {
      p = addPlayer({ cid, name: d.name, avatar: d.avatar });
      p.conn = conn; p.online = true;
      if (H.phase === 'lobby') beep('ok');
    }
    conn.playerId = p.id;
    sendTo(p, { t: 'welcome', id: p.id, name: p.name, avatar: p.avatar });
    sendState(p);
    refreshPlayers();
    return;
  }
  const p = playerByConn(conn); if (!p) return;
  if (d.t === 'leave') { // aluno saiu da sala pelo botão
    if (H.phase === 'lobby' || H.phase === 'setup') H.players.delete(p.id); else { p.online = false; p.conn = null; }
    refreshPlayers(); return;
  }
  if (d.t === 'audio') {
    let wav = d.wav;
    if (wav instanceof Uint8Array) wav = wav.buffer.slice(wav.byteOffset, wav.byteOffset + wav.byteLength);
    if (!(wav instanceof ArrayBuffer) || wav.byteLength < 1000 || wav.byteLength > 1600000) return;
    if (d.ri !== H.ri || H.phase !== 'round') return;
    if (!H.open) { sendTo(p, { t: 'closed', ri: H.ri }); return; }
    const cur = p.res[H.ri];
    if (cur && cur.status !== 'erro') return; // um envio por rodada
    acceptSubmission(p, wav);
  }
}

function roundMsg(p) {
  const r = H.rounds[H.ri];
  return { t: 'round', ri: H.ri, total: H.rounds.length, lang: r.lang, text: r.text, tr: r.tr, character: r.character, open: H.open, submitted: !!(p && p.res[H.ri]) };
}
function sendState(p) {
  if (H.phase === 'setup' || H.phase === 'lobby') sendTo(p, { t: 'lobby' });
  else if (H.phase === 'round') { sendTo(p, roundMsg(p)); const res = p.res[H.ri]; if (res) sendTo(p, resultMsg(res, H.ri) || { t: 'status', ri: H.ri, status: res.status, pos: queuePos(p) }); }
  else if (H.phase === 'rank') sendTo(p, rankMsg(p));
  else if (H.phase === 'podium') sendTo(p, Object.assign(rankMsg(p), { t: 'end' }));
}

/* ----- tela 2: sala de espera ----- */

    </section>

ACT['copy-link'] = () => {
  const link = roomURL();
  (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast('Link copiado!', 'ok'), () => {
    const i = document.createElement('input'); i.value = link; document.body.appendChild(i); i.select();

ACT['add-local'] = () => {
  const inp = $('#local-name'); const name = cleanName(inp.value);
  if (!name) return toast('Digite o apelido do aluno.', 'err');

};
ACT.kick = el => {
  const p = H.players.get(el.dataset.id); if (!p) return;
  if (!confirm(`Remover ${p.name} da sala?`)) return;
  sendTo(p, { t: 'kicked' });
  setTimeout(() => { try { p.conn && p.conn.close(); } catch (e) {} }, 300);
  H.players.delete(p.id); refreshPlayers();
};
ACT['to-setup'] = () => hostSetup();

function refreshPlayers() {
  if (H.phase === 'lobby') {
    const box = $('#lobby-players'); if (!box) return;
    const ps = [...H.players.values()];
    $('#p-count').textContent = `(${ps.length})`;
    box.innerHTML = ps.length ? ps.map(p => `<div class="pchip"><span class="dot ${p.online ? '' : 'off'}"></span><span class="av">${p.avatar}</span><span class="nm">${esc(p.name)}${p.local ? ' <span class="tag">local</span>' : ''}</span><button class="x" data-act="kick" data-id="${p.id}" title="Remover">✕</button></div>`).join('')
      : `<p class="muted small">Aguardando os alunos escanearem o QR code…</p>`;
    const b = $('#btn-start'); if (b) b.disabled = !ps.length;
  } else if (H.phase === 'round') renderGrid();
  else if (H.phase === 'rank' || H.phase === 'podium') renderRankList(H.phase === 'podium');
}

/* ----- tela 3: rodada ----- */
ACT.start = () => {
  if (!H.players.size) return;
  H.players.forEach(p => { p.res = {}; });
  H.ri = -1; H.queue = []; nextRound();
};
function nextRound() {
  H.ri++;
  if (H.ri >= H.rounds.length) return hostPodium();
  H.phase = 'round'; H.open = true;
  hostRound();
  H.players.forEach(p => sendTo(p, roundMsg(p)));
}
ACT.next = () => nextRound();
function hostRound() {
  closeModal();
  const r = H.rounds[H.ri];
  app.innerHTML = `
  <section class="panel">
    <div class="row between wrap-row">
      <div class="row wrap-row"><span class="pill gold">Rodada ${H.ri + 1}/${H.rounds.length}</span>${langBadge(r.lang)}</div>
      <div id="round-meta" class="row wrap-row small muted"></div>
    </div>
    ${r.character ? charBanner(r.character) : ''}
    <div class="phrase">“${esc(r.text)}”</div>
    <div class="row center wrap-row">
      <button class="btn" data-act="tts">🔊 Ouvir pronúncia</button>
      ${r.tr ? `<button class="btn ghost" data-act="toggle-tr">👁 Tradução</button>` : ''}
    </div>
    ${r.tr ? `<p id="tr" class="tr hidden">${esc(r.tr)}</p>` : ''}
  </section>
  <section class="panel">
    <div class="row between wrap-row"><h3 id="grid-title"></h3><div id="round-actions" class="row wrap-row"></div></div>
    <div id="grid" class="pgrid"></div>
    <p class="small muted">Clique num aluno para ouvir a gravação, ver a análise e ajustar a nota.</p>
  </section>`;
  renderGrid();
}
ACT.tts = () => {
  const r = IS_STUDENT ? S.round : H.rounds[H.ri]; if (!r) return;
  const loc = r.lang === 'fr' ? (IS_STUDENT ? 'fr-FR' : H.cfg.frLocale) : (IS_STUDENT ? 'es-ES' : H.cfg.esLocale);
  speak(r.text, loc);
};
function queuePos(p) { const i = H.queue.findIndex(j => j.p === p && j.ri === H.ri); return i < 0 ? 0 : i + 1 + (H.busy ? 1 : 0); }
function cardHTML(p) {
  const res = p.res[H.ri];
  let body;
  if (!res) {
    if (!H.open) body = `<span class="st off">— não enviou</span>`;
    else if (p.local) body = `<button class="btn sm blue" data-act="rec-local" data-id="${p.id}">🎙️ Gravar aqui</button>`;
    else body = p.online ? `<span class="st">🎙️ gravando…</span>` : `<span class="st off">📴 desconectado</span>`;
  } else if (res.status === 'fila') body = `<span class="st">⏳ na fila</span>`;
  else if (res.status === 'avaliando') body = `<span class="st"><i class="spin"></i> avaliando…</span>`;
  else if (res.status === 'erro') body = res.final != null ? `<div class="score ${scoreCls(res.final)}">${res.final}</div><span class="st">nota manual</span>` : `<span class="st err">⚠️ sem avaliação<br>clique para ouvir e dar nota</span>`;
  else body = `<div class="score ${scoreCls(res.final)}">${res.final ?? '–'}</div>${res.bonus ? '<span class="bonus">+10 🎭</span>' : ''}`;
  return `<div class="pcard ${res ? 'has' : ''}" ${res ? `data-act="detail" data-id="${p.id}"` : ''}>
    <div class="av">${p.avatar}</div><div class="nm">${esc(p.name)}${p.local ? ' <span class="tag">local</span>' : ''}</div>${body}</div>`;
}
function renderGrid() {
  const grid = $('#grid'); if (!grid) return;
  const ps = [...H.players.values()];
  grid.innerHTML = ps.map(cardHTML).join('');
  const sent = ps.filter(p => p.res[H.ri]).length;
  $('#grid-title').textContent = `Enviaram ${sent} de ${ps.length}`;
  const pend = H.queue.length + (H.busy ? 1 : 0);
  $('#round-meta').innerHTML = pend ? `<i class="spin"></i> ${pend} avaliação(ões) na fila` : (sent ? '✅ fila de avaliação vazia' : '');
  $('#round-actions').innerHTML = H.open
    ? `<button class="btn danger" data-act="close-rec">⏹ Encerrar gravações</button>`
    : `<span class="pill">Gravações encerradas</span><button class="btn gold" data-act="show-rank">📊 Ver ranking</button>`;
}
ACT['close-rec'] = () => {
  const ps = [...H.players.values()]; const missing = ps.filter(p => !p.res[H.ri]).length;
  if (missing && !confirm(`${missing} jogador(es) ainda não enviaram. Encerrar mesmo assim?`)) return;
  H.open = false; H.players.forEach(p => sendTo(p, { t: 'closed', ri: H.ri })); renderGrid();
};
ACT['rec-local'] = el => {
  const p = H.players.get(el.dataset.id); if (!p || !H.open) return;
  const r = H.rounds[H.ri];
  const m = openModal(`
    <div class="row between"><h3>${p.avatar} ${esc(p.name)} — grave aqui</h3><button class="btn sm ghost" data-act="close-modal">✕</button></div>
    ${langBadge(r.lang)}
    <div class="phrase" style="font-size:26px">“${esc(r.text)}”</div>
    <div id="local-rec"></div>`, () => { if (H.localRec) { H.localRec.destroy(); H.localRec = null; } });
  H.localRec = mountRecorder(m.querySelector('#local-rec'), {
    maxSec: 20,
    onSubmit: (result) => {
      if (!H.open) { toast('As gravações desta rodada já foram encerradas.', 'err'); return false; }
      acceptSubmission(p, result.wav); H.localRec = null; closeModal(); return true;
    }
  });
};

/* ----- fila de avaliação (plano gratuito do Azure: 1 avaliação por vez) ----- */
function acceptSubmission(p, wav) {
  const res = { status: 'fila', wav, url: URL.createObjectURL(new Blob([wav], { type: 'audio/wav' })), dur: (wav.byteLength - 44) / 32000, ev: null, auto: null, final: null, bonus: false, err: '' };
  const old = p.res[H.ri]; if (old && old.url) URL.revokeObjectURL(old.url);
  p.res[H.ri] = res;
  H.queue.push({ p, ri: H.ri, res });
  sendTo(p, { t: 'status', ri: H.ri, status: 'fila', pos: queuePos(p) });
  refreshPlayers();
  const ps = [...H.players.values()];
  if (H.open && ps.every(x => x.res[H.ri] || (!x.online && !x.local))) toast('Todos os alunos conectados já enviaram! 🎉', 'ok');
  pump();
}
function notifyQueue() { H.queue.forEach((j, i) => { if (j.ri === H.ri) sendTo(j.p, { t: 'status', ri: j.ri, status: 'fila', pos: i + 1 + (H.busy ? 1 : 0) }); }); }
async function pump() {
  if (H.busy) return;
  H.busy = true;
  while (H.queue.length) {
    const job = H.queue.shift(); const { p, ri, res } = job;
    if (p.res[ri] !== res) continue; // gravação substituída ou removida
    res.status = 'avaliando';
    if (ri === H.ri) { sendTo(p, { t: 'status', ri, status: 'avaliando' }); notifyQueue(); }
    refreshPlayers();
    try {
      const r = H.rounds[ri];
      res.ev = await assessWithRetry(res.wav, r.text, r.lang);
      res.auto = Math.round(res.ev.pron); if (res.final == null) res.final = res.auto; res.status = 'pronto';
    } catch (err) {
      res.status = 'erro'; res.err = err.message || String(err);
      if (err.kind === 'auth' && !H.authFailed) { H.authFailed = true; toast('❌ O Azure recusou a chave/região. Confira em ⚙️ Azure.', 'err', 8000); }
      if (err.kind === 'quota') toast('⚠️ O Azure recusou: o limite gratuito do mês pode ter acabado. Dê as notas manualmente.', 'err', 9000);
    }
    if (p.res[ri] === res) {
      const m = resultMsg(res, ri); if (m) sendTo(p, m);
      if (H.detailId === p.id && ri === H.ri && $('#modal-root .modal')) openDetail(p.id);
    }
    refreshPlayers();
  }
  H.busy = false; refreshPlayers();
}
function resultMsg(res, ri) {
  if (res.status === 'pronto') return { t: 'result', ri, score: res.final, bonus: res.bonus, adjusted: res.final !== res.auto, ev: res.ev };
  if (res.status === 'erro') return { t: 'result', ri, error: true, score: res.final, bonus: res.bonus };
  return null;
}

/* ----- avaliação no Azure (SDK oficial da Microsoft, roda no navegador) ----- */
class AssessError extends Error { constructor(kind, msg) { super(msg); this.kind = kind; } }
async function loadSDK() {
  try { await loadScript(LIBS.sdk); } catch (e) { throw new AssessError('sdk', 'Não consegui carregar o SDK da Microsoft (verifique a internet).'); }
  if (!window.SpeechSDK) throw new AssessError('sdk', 'SDK da Microsoft indisponível.');
  return window.SpeechSDK;
}
function parseAssessment(json) {
  const j = JSON.parse(json); const nb = (j.NBest && j.NBest[0]) || {};
  const pa = nb.PronunciationAssessment || nb;
  const words = (nb.Words || []).map(w => { const wp = w.PronunciationAssessment || w; return { w: String(w.Word || ''), s: +wp.AccuracyScore || 0, e: wp.ErrorType || 'None' }; });
  return { pron: +pa.PronScore || 0, acc: +pa.AccuracyScore || 0, flu: +pa.FluencyScore || 0, comp: +pa.CompletenessScore || 0, text: j.DisplayText || nb.Display || '', words };
}
async function assessRaw({ key, region, locale }, wav, refText) {
  const sdk = await loadSDK();
  if (!key) throw new AssessError('nokey', 'A chave do Azure não foi configurada. Ouça a gravação e dê a nota manualmente.');
  const pcm = wav.slice(44);
  addUsage(pcm.byteLength / 32000 + 0.5);
  return new Promise((resolve, reject) => {
    let rec, done = false;
    const finish = (fn, v) => { if (done) return; done = true; clearTimeout(to); try { rec && rec.close(); } catch (e) {} fn(v); };
    const to = setTimeout(() => finish(reject, new AssessError('timeout', 'O Azure demorou demais para responder.')), 30000);
    try {
      const sc = sdk.SpeechConfig.fromSubscription(key, region);
      sc.speechRecognitionLanguage = locale;
      sc.outputFormat = sdk.OutputFormat.Detailed;
      sc.setProperty(sdk.PropertyId.Speech_SegmentationSilenceTimeoutMs, '1500'); // tolera pausas curtas no meio da frase
      const push = sdk.AudioInputStream.createPushStream(sdk.AudioStreamFormat.getWaveFormatPCM(16000, 16, 1));
      push.write(pcm); push.write(new ArrayBuffer(16000)); push.close(); // + 0,5 s de silêncio no fim
      rec = new sdk.SpeechRecognizer(sc, sdk.AudioConfig.fromStreamInput(push));
      const pac = new sdk.PronunciationAssessmentConfig(refText, sdk.PronunciationAssessmentGradingSystem.HundredMark, sdk.PronunciationAssessmentGranularity.Phoneme, true);
      pac.applyTo(rec);
      const nomatch = () => ({ nomatch: true, pron: 0, acc: 0, flu: 0, comp: 0, text: '', words: refText.split(/\s+/).filter(Boolean).map(w => ({ w, s: 0, e: 'Omission' })) });
      rec.recognizeOnceAsync(res => {
        try {
          if (res.reason === sdk.ResultReason.RecognizedSpeech) finish(resolve, parseAssessment(res.properties.getProperty(sdk.PropertyId.SpeechServiceResponse_JsonResult)));
          else if (res.reason === sdk.ResultReason.NoMatch) finish(resolve, nomatch());
          else if (res.reason === sdk.ResultReason.Canceled) {
            const cd = sdk.CancellationDetails.fromResult(res);
            if (cd.reason === sdk.CancellationReason.EndOfStream) return finish(resolve, nomatch());
            const C = sdk.CancellationErrorCode, det = String(cd.errorDetails || '');
            let e;
            if (cd.ErrorCode === C.AuthenticationFailure || /401|unauthori[sz]ed|invalid subscription/i.test(det)) e = new AssessError('auth', 'Chave ou região do Azure incorreta.');
            else if (/quota|403|forbidden/i.test(det) || cd.ErrorCode === C.Forbidden) e = new AssessError('quota', 'O Azure recusou a avaliação (limite gratuito do mês pode ter acabado).');
            else if (cd.ErrorCode === C.TooManyRequests || /429|too many/i.test(det)) e = new AssessError('busy', 'O Azure está ocupado (muitas requisições).');
            else if (cd.ErrorCode === C.ConnectionFailure) e = new AssessError('conn', 'Falha de conexão com o Azure (internet ou região incorreta).');
            else e = new AssessError('service', 'Erro do Azure: ' + (det || 'desconhecido'));
            finish(reject, e);
          } else finish(reject, new AssessError('unknown', 'Resposta inesperada do Azure.'));
        } catch (e) { finish(reject, new AssessError('parse', 'Não consegui ler a resposta do Azure.')); }
      }, err => finish(reject, new AssessError('sdk', 'Erro no SDK: ' + err)));
    } catch (e) { finish(reject, new AssessError('sdk', 'Erro ao preparar a avaliação: ' + (e.message || e))); }
  });
}
async function assessWithRetry(wav, refText, lang) {
  const opts = { key: H.key, region: (H.cfg.region || '').trim().toLowerCase(), locale: lang === 'fr' ? H.cfg.frLocale : H.cfg.esLocale };
  for (let attempt = 0; ; attempt++) {
    try { return await assessRaw(opts, wav, refText); }
    catch (e) {
      const retry = (e.kind === 'busy' && attempt < 5) || ((e.kind === 'conn' || e.kind === 'timeout') && attempt < 1);
      if (!retry) throw e;
      await sleep(1500 + attempt * 1000);
    }
  }
}

/* ----- ranking entre rodadas e pódio ----- */
const pts = res => res ? (res.final || 0) + (res.bonus ? 10 : 0) : 0;
function ranking() {
  const list = [...H.players.values()].map(p => ({ p, total: Object.values(p.res).reduce((a, r) => a + pts(r), 0), last: pts(p.res[H.ri]) }));
  list.sort((a, b) => b.total - a.total || a.p.name.localeCompare(b.p.name));
  list.forEach((x, i) => { x.pos = i > 0 && x.total === list[i - 1].total ? list[i - 1].pos : i + 1; });
  return list;
}
function rankMsg(p) { const list = ranking(); const me = list.find(x => x.p === p) || { pos: list.length, total: 0, last: 0 }; return { t: 'rank', ri: H.ri, pos: me.pos, n: list.length, total: me.total, last: me.last, isLast: H.ri >= H.rounds.length - 1 }; }
ACT['show-rank'] = () => hostRank();
ACT['back-round'] = () => { H.phase = 'round'; hostRound(); };
function hostRank() {
  H.phase = 'rank'; closeModal();

}
function renderRankList(all) {
  const box = $('#rank-list'); if (!box) return;

/* Identidade do aluno vale só para a sala em que ele entrou: se recarregar a página
   na mesma sala, volta automaticamente; numa sala nova, começa do zero. */
const SESSION_TTL = 4 * 3600 * 1000;
const newCid = () => 'c' + Math.random().toString(36).slice(2) + Date.now().toString(36);
const randAvatar = () => AVATARS[Math.floor(Math.random() * AVATARS.length)];
function loadSession(pin) { const x = store.get('fpd_session', null); return x && pin && x.pin === pin && Date.now() - x.t < SESSION_TTL ? x : null; }
function saveSession() { store.set('fpd_session', { pin: S.pin, name: S.name, avatar: S.avatar, cid: S.cid, relay: S.relay, t: Date.now() }); }
const S0pin = (params.get('sala') || '').replace(/\D/g, '').slice(0, 6);
const S0 = loadSession(S0pin);
const S = {
  pin: S0pin,
  cid: S0 ? S0.cid : newCid(),
  name: S0 ? S0.name : '',
  avatar: S0 ? S0.avatar : randAvatar(),
  relay: decodeRelay(params.get('r') || '') || (S0 && validRelay(S0.relay)) || null,
  peer: null, conn: null, connected: false, everConnected: false, tries: 0, lostTimer: null, connTimer: null,
  screen: 'join', round: null, sub: null, result: null, rank: null, rec: null, failKind: ''
};
function renderConn() {
  const st = S.screen === 'join' || S.screen === 'fail' ? '' : S.connected ? `<span class="pill on">🟢 conectado</span>` : `<span class="pill off">🟡 reconectando…</span>`;
  $('#hdr').innerHTML = `${st}${S.name && S.screen !== 'join' ? `<span class="pill">${S.avatar} ${esc(S.name)}</span>` : ''}<button class="btn sm" data-act="mute">${muted ? '🔇' : '🔊'}</button>`;
}
function renderStudent() {
  renderConn();
  if (S.screen !== 'round' && S.rec) { S.rec.destroy(); S.rec = null; }
  if (S.screen === 'join') {
    app.innerHTML = `
    <section class="panel narrow">
      <div class="center"><div class="mascot sm">🦜</div><h2>Entrar na sala</h2></div>
      <label class="lbl" for="j-pin">PIN da sala</label>
      <input id="j-pin" inputmode="numeric" autocomplete="off" maxlength="6" value="${esc(S.pin)}" placeholder="0000" style="font-size:24px;text-align:center;letter-spacing:6px;font-weight:800">
      <label class="lbl" for="j-name">Seu apelido</label>
      <input id="j-name" maxlength="20" autocomplete="nickname" value="${esc(S.name)}" placeholder="Ex.: Ana B.">
      <label class="lbl">Escolha seu bicho</label>
      <div class="avgrid">${AVATARS.map(a => `<button class="avbtn ${a === S.avatar ? 'sel' : ''}" data-act="pick-av" data-av="${a}">${a}</button>`).join('')}</div>
      <div style="height:16px"></div>
      <button class="btn gold big full" data-act="join">Entrar 🚀</button>
      <p class="small muted center">Use um apelido — não precisa do nome completo.</p>
    </section>`;
    $('#j-name').addEventListener('keydown', e => { if (e.key === 'Enter') ACT.join(); });
  } else if (S.screen === 'connecting') {
    app.innerHTML = `<section class="panel narrow center"><div class="big-emoji">📡</div><h3><i class="spin"></i> Conectando à sala ${esc(S.pin)}…</h3><p class="muted">Isso leva alguns segundos.</p></section>`;
  } else if (S.screen === 'lobby') {
    app.innerHTML = `<section class="panel narrow center"><div class="big-emoji" style="font-size:80px">${S.avatar}</div><h2>Você está na sala! 🎉</h2><p class="muted">Olhe para a tela do professor. O duelo começa já já…</p><p class="small muted">Dica: deixe o celular com a tela ligada e o som ativado.</p><button class="btn sm ghost" data-act="switch-student">↩️ Não é você? Sair da sala</button></section>`;
  } else if (S.screen === 'round') studentRound();
  else if (S.screen === 'rank') {
    const d = S.rank;
    app.innerHTML = `<section class="panel narrow center"><div class="big-emoji">📊</div><h2>Você está em ${d.pos}º lugar</h2><p>de ${d.n} jogador(es) · <b style="color:#fcd34d">${d.total} pontos</b></p>${d.last ? `<p class="muted">+${d.last} nesta rodada</p>` : ''}<p class="small muted">${d.isLast ? 'Última rodada! Aguarde o resultado final…' : 'Aguarde a próxima rodada…'}</p></section>`;
  } else if (S.screen === 'end') {
    const d = S.rank;
    app.innerHTML = `<section class="panel narrow center"><div class="big-emoji bounce">${d.pos === 1 ? '🥇' : d.pos === 2 ? '🥈' : d.pos === 3 ? '🥉' : '🏁'}</div><h2>Fim do duelo!</h2><p>Você terminou em <b>${d.pos}º lugar</b> de ${d.n}, com <b style="color:#fcd34d">${d.total} pontos</b>.</p><p class="muted">Merci ! ¡Gracias! 🦜</p><button class="btn sm ghost" data-act="switch-student">↩️ Sair da sala</button></section>`;
  } else if (S.screen === 'fail') {
    const msg = {
      nosala: 'Sala não encontrada. Confira o PIN — ou o professor ainda não abriu a sala.',
      timeout: 'Não consegui me conectar à sala. A rede Wi‑Fi pode estar bloqueando a conexão: tente pelo 4G, ou peça ao professor para configurar a retransmissão (⚙️) e escaneie o QR code de novo.',
      kicked: 'O professor removeu você da sala.',
      nopeer: 'Não consegui carregar os componentes da página. Verifique a internet e recarregue.'
    }[S.failKind] || 'A conexão caiu.';
    app.innerHTML = `<section class="panel narrow center"><div class="big-emoji">😕</div><h3>${msg}</h3><button class="btn gold big" data-act="rejoin">Tentar de novo</button></section>`;
  }
}
ACT['pick-av'] = el => { S.avatar = el.dataset.av; document.querySelectorAll('.avbtn').forEach(b => b.classList.toggle('sel', b === el)); };
ACT.join = () => {
  const pin = $('#j-pin').value.replace(/\D/g, ''), name = cleanName($('#j-name').value);
  if (pin.length < 4) return toast('Digite o PIN que aparece na tela do professor.', 'err');
  if (!name) return toast('Escolha um apelido.', 'err');
  const prev = loadSession(pin);
  S.cid = prev && prev.name === name ? prev.cid : newCid(); // mesmo aluno voltando ou aluno novo
  S.pin = pin; S.name = name; saveSession();
  try { history.replaceState(null, '', location.pathname + '?sala=' + pin + (S.relay ? '&r=' + encodeRelay(S.relay) : '')); } catch (e) {}
  S.screen = 'connecting'; S.tries = 0; S.everConnected = false; renderStudent(); studentConnect();
};
ACT.rejoin = () => { cleanupPeer(); S.screen = 'join'; renderStudent(); };
ACT['switch-student'] = () => {
  if (!confirm('Sair da sala neste celular? (Use para outro aluno entrar com este aparelho.)')) return;
  try { S.conn && S.conn.open && S.conn.send({ t: 'leave' }); } catch (e) {}
  setTimeout(cleanupPeer, 300); store.del('fpd_session');
  S.name = ''; S.avatar = randAvatar(); S.cid = newCid(); S.round = null; S.sub = null; S.result = null;
  S.screen = 'join'; renderStudent();
};

function cleanupPeer() {
  clearTimeout(S.connTimer); clearTimeout(S.lostTimer); S.lostTimer = null;
  try { S.conn && S.conn.close(); } catch (e) {}
  try { S.peer && S.peer.destroy(); } catch (e) {}
  S.peer = null; S.conn = null; S.connected = false;
}
async function studentConnect() {
  cleanupPeer();
  if (typeof Peer !== 'function') return fail('nopeer');
  const seq = S.seq = (S.seq || 0) + 1;
  const opts = await peerOptions(S.relay);
  if (seq !== S.seq || S.screen === 'fail' || S.screen === 'join') return; // outra tentativa começou
  const peer = new Peer(undefined, opts); S.peer = peer;
  S.connTimer = setTimeout(() => { if (!S.connected && S.peer === peer) lost(); }, 15000);
  peer.on('open', () => {
    if (S.peer !== peer) return;
    const conn = peer.connect(PEER_PREFIX + S.pin, { reliable: true });
    conn.on('open', () => {
      if (S.peer !== peer) return;
      clearTimeout(S.connTimer);
      S.conn = conn; S.connected = true; S.everConnected = true; S.tries = 0;
      conn.send({ t: 'join', cid: S.cid, name: S.name, avatar: S.avatar });
      renderConn();
    });
    conn.on('data', onHostMsg);
    conn.on('close', () => { if (S.conn === conn || S.peer === peer) lost(); });
    conn.on('error', () => { if (S.peer === peer) lost(); });
  });
  peer.on('error', err => {
    if (S.peer !== peer) return;
    if (err.type === 'peer-unavailable' && !S.everConnected && S.tries >= 1) fail('nosala');
    else lost();
  });
}
function lost() {
  if (S.screen === 'fail' || S.lostTimer) return;
  S.connected = false; renderConn();
  S.tries++;
  if (!S.everConnected && S.tries > 3) return fail('timeout');
  S.lostTimer = setTimeout(() => { S.lostTimer = null; studentConnect(); }, Math.min(8000, 1000 + S.tries * 1200));
}
function fail(kind) { cleanupPeer(); S.failKind = kind; S.screen = 'fail'; renderStudent(); }
document.addEventListener('visibilitychange', () => {
  if (!IS_STUDENT || document.visibilityState !== 'visible') return;
  if (['join', 'fail'].includes(S.screen) || S.connected) return;
  clearTimeout(S.lostTimer); S.lostTimer = null; studentConnect();
});

function onHostMsg(d) {
  if (!d || typeof d !== 'object') return;
  switch (d.t) {
    case 'welcome':
      S.name = cleanName(d.name) || S.name; if (AVATARS.includes(d.avatar)) S.avatar = d.avatar; saveSession();
      if (S.screen === 'connecting' || S.screen === 'join') { S.screen = 'lobby'; renderStudent(); } else renderConn();
      break;
    case 'lobby': S.round = null; S.sub = null; S.result = null; S.screen = 'lobby'; renderStudent(); break;
    case 'round': {
      const changed = !S.round || S.round.ri !== d.ri;
      if (changed) { if (S.rec) { S.rec.destroy(); S.rec = null; } if (S.sub && S.sub.url) URL.revokeObjectURL(S.sub.url); S.sub = null; S.result = null; }
      S.round = d;
      if (d.submitted && !S.sub) S.sub = { status: 'enviado' };
      if (!d.submitted && S.sub && !changed) { S.sub = null; S.result = null; }
      const was = S.screen; S.screen = 'round';
      if (changed || was !== 'round') { renderStudent(); if (changed) beep('ok'); } else renderRoundBody();
      break;
    }
    case 'closed':
      if (S.round && S.round.ri === d.ri) { S.round.open = false; if (S.rec) { S.rec.destroy(); S.rec = null; } if (S.screen === 'round') renderRoundBody(); }
      break;
    case 'status':
      if (S.round && S.round.ri === d.ri) { S.sub = Object.assign(S.sub || {}, { status: d.status, pos: d.pos }); if (!S.result && S.screen === 'round') renderRoundBody(); }
      break;
    case 'result':
      if (S.round && S.round.ri === d.ri) {
        const first = !S.result; S.result = d; S.sub = Object.assign(S.sub || {}, { status: 'pronto' });
        if (S.screen === 'round') renderRoundBody();
        if (first && !d.error) { beep((d.score || 0) >= 70 ? 'win' : 'ok'); if ((d.score || 0) >= 85) confettiBurst(); }
      }
      break;
    case 'redo':
      if (S.round && S.round.ri === d.ri) { S.sub = null; S.result = null; if (S.screen === 'round') renderRoundBody(); toast('O professor pediu para você gravar de novo.'); }
      break;
    case 'rank': S.rank = d; S.screen = 'rank'; renderStudent(); break;
    case 'end': S.rank = d; S.screen = 'end'; renderStudent(); if (d.pos <= 3) confettiBurst(); beep('win'); break;
    case 'kicked': fail('kicked'); break;
  }
}
function studentRound() {
  const r = S.round;
  app.innerHTML = `
  <section class="panel">
    <div class="row between wrap-row"><span class="pill gold">Rodada ${r.ri + 1}/${r.total}</span>${langBadge(r.lang)}</div>
    ${r.character ? charBanner(r.character) : ''}
    <div class="phrase">“${esc(r.text)}”</div>
    <div class="row center wrap-row"><button class="btn" data-act="tts">🔊 Ouvir</button>${r.tr ? `<button class="btn ghost" data-act="toggle-tr">👁 Tradução</button>` : ''}</div>
    ${r.tr ? `<p id="tr" class="tr hidden">${esc(r.tr)}</p>` : ''}
  </section>
  <section class="panel" id="s-body"></section>`;
  renderRoundBody();
}
function renderRoundBody() {
  const el = $('#s-body'); if (!el) return;
  const r = S.round;
  if (S.result) {
    if (S.rec) { S.rec.destroy(); S.rec = null; }
    const d = S.result, s = d.score;
    const mine = S.sub && S.sub.url ? `<p class="small muted">Sua gravação:</p><audio controls src="${S.sub.url}"></audio>` : '';
    if (d.error) {
      el.innerHTML = `<div class="center"><div class="big-emoji">🧑‍🏫</div>${s != null ? `<div class="score big ${scoreCls(s)}">${s}${d.bonus ? '<small style="font-size:20px"> +10🎭</small>' : ''}</div><p class="muted">Nota dada pelo professor.</p>` : `<h3>O professor vai avaliar a sua gravação</h3>`}${mine}</div>`;
      return;
    }
    const msg = s >= 85 ? 'Excelente! 🌟' : s >= 70 ? 'Muito bom! 👏' : s >= 50 ? 'Quase lá! 💪' : 'Vamos praticar mais! 🎯';
    el.innerHTML = `<div class="center"><div class="score big ${scoreCls(s)}">${s ?? '–'}${d.bonus ? '<small style="font-size:20px"> +10🎭</small>' : ''}</div><h3>${msg}</h3>${d.adjusted ? '<p class="small muted">Nota ajustada pelo professor.</p>' : ''}</div>
      ${d.ev ? evalHTML(d.ev, r.lang) : ''}<div class="center" style="margin-top:12px">${mine}</div>`;
    return;
  }
  if (S.sub) {
    if (S.rec) { S.rec.destroy(); S.rec = null; }
    const ev = S.sub.status === 'avaliando';
    el.innerHTML = `<div class="center"><div class="big-emoji">${ev ? '🧠' : '📨'}</div><h3>${ev ? 'Avaliando a sua pronúncia…' : 'Gravação enviada!'}</h3>
      <p class="muted">${S.sub.status === 'fila' && S.sub.pos > 1 ? `Posição na fila de avaliação: ${S.sub.pos}` : 'O resultado aparece aqui em instantes.'}</p>
      ${S.sub.url ? `<audio controls src="${S.sub.url}"></audio>` : ''}</div>`;
    return;
  }
  if (!r.open) { if (S.rec) { S.rec.destroy(); S.rec = null; } el.innerHTML = `<div class="center"><div class="big-emoji">⏰</div><h3>Gravações encerradas</h3><p class="muted">Aguarde a próxima rodada.</p></div>`; return; }
  if (S.rec && S.rec.el.isConnected) return;
  el.innerHTML = '';
  if (S.rec) { el.appendChild(S.rec.el); return; }
  S.rec = mountRecorder(el, {
    maxSec: 20,
    onSubmit: (result, url) => {
      if (!S.connected || !S.conn || !S.conn.open) { toast('Sem conexão com a sala agora. Aguarde reconectar e toque em Enviar de novo.', 'err', 5000); return false; }
      if (!S.round.open) { toast('As gravações desta rodada já foram encerradas.', 'err'); return false; }
      try { S.conn.send({ t: 'audio', ri: S.round.ri, wav: result.wav, dur: result.dur }); }
      catch (e) { toast('Não consegui enviar. Tente de novo.', 'err'); return false; }
      S.sub = { status: 'enviado', url }; S.rec = null;
      renderRoundBody(); return true;
    }
  });
}
function initStudent() {
  if (S.pin && S.name) { S.screen = 'connecting'; renderStudent(); studentConnect(); }
  else renderStudent();
}

/* ---------- início ---------- */
IS_STUDENT ? initStudent() : initHost();
</script>
</body>
</html>
